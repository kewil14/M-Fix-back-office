<form (ngSubmit)="updateAuthority()" [formGroup]="authorityForm">
  <div class="row">
    <div class="col-lg-12">
      <div class="mb-3">
          <label for="name" class="form-label">Nom</label>
          <input type="text" [value]="(authority$|async)?.authority?.authorisationName" class="form-control" [disabled]="true" placeholder="{{'FORMS.NAME'|translate | titlecase}}">
      </div>
    </div>
    <div class="col-lg-12">
      <div class="mb-3">
          <label for="gorup" class="form-label">Groupe d'autorisation</label>
          <input type="text" [value]="(authority$|async)?.authority?.authorisationGroup?.groupName" class="form-control" [disabled]="true" placeholder="Groupe d'autorisation">
      </div>
    </div>

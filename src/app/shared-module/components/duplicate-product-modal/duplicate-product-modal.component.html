<div class="modal-header border-0 pb-0">
  <h5 class="modal-title">{{ title }}</h5>
  <button type="button" class="btn-close" (click)="decline()" aria-label="Close"></button>
</div>
<div class="modal-body p-4">
  <div class="mb-3">
    <p class="text-muted mb-3" *ngIf="productLabel">
      Dupliquer le produit <strong>"{{ productLabel }}"</strong>
    </p>
    
    <div class="mb-3">
      <label for="newLabel" class="form-label">Nouveau nom du produit <span class="text-danger">*</span></label>
      <input
        type="text"
        class="form-control"
        id="newLabel"
        [(ngModel)]="newLabel"
        placeholder="Nom du produit dupliqué"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Options de duplication</label>
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          id="copyImages"
          [(ngModel)]="copyImages">
        <label class="form-check-label" for="copyImages">
          Copier les images
        </label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          id="copyStock"
          [(ngModel)]="copyStock">
        <label class="form-check-label" for="copyStock">
          Copier le stock
        </label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          id="copyReviews"
          [(ngModel)]="copyReviews">
        <label class="form-check-label" for="copyReviews">
          Copier les avis
        </label>
      </div>
    </div>
  </div>
  
  <div class="d-flex gap-2 justify-content-end">
    <button type="button" class="btn btn-light" (click)="decline()">
      <i class="mdi mdi-close me-1"></i>{{ cancelBtnText }}
    </button>
    <button type="button" class="btn btn-primary" (click)="confirm()" [disabled]="!newLabel || !newLabel.trim()">
      <i class="mdi mdi-content-copy me-1"></i>{{ confirmBtnText }}
    </button>
  </div>
</div>

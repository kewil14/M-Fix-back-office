                      </div>
                    </div>
                    <div class="card-body">
                        <div *ngFor="let group of availableGroupAuthorities$ | async" id="static-{{group.group}}">
                            <div class=" border-0 bg-transparent">
                                <div class="col" >
                                    <button  type="button" class="btn btn-soft-success btn-sm shadow-none">
                                        <i class="ri-checkbox-circle-fill align-middle me-1"></i>
                                    </button>
                                    <span class="ms-3">{{group.group}}</span>
                                </div>
                            </div>
                            <div >
                                <div *ngFor="let item of group.items">
                                    <div class="col">
                                        <button  type="button" class="btn btn-light-success ms-auto btn-sm">

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

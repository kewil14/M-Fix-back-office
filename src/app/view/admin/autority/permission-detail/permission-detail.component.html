<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header border-bottom">
        <div class="d-flex justify-content-between align-items-center">
          <h4 class="card-title mb-0">Détails de la Permission</h4>
          <button type="button" class="btn btn-light" (click)="onBack()">
            <i class="ri-arrow-left-line me-1"></i>Retour
          </button>
        </div>
      </div>
      <div class="card-body" *ngIf="permission">
        <div class="row">
          <div class="col-md-6">
            <div class="mb-4">
              <label class="form-label text-muted">Clé d'autorisation</label>
              <div class="fs-5">
                <span class="badge bg-primary">{{ permission.authorisationKey || 'N/A' }}</span>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-4">
              <label class="form-label text-muted">Nom</label>
              <div class="fs-5 fw-semibold">{{ permission.authorisationName || 'N/A' }}</div>
            </div>
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6">
            <div class="mb-4">
              <label class="form-label text-muted">Groupe</label>
              <div>
                <span class="badge bg-info">{{ permission.authorisationGroup?.groupName || 'N/A' }}</span>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-4">
              <label class="form-label text-muted">Description</label>
              <div class="fs-6">{{ permission.authorisationDescription || 'N/A' }}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card-body text-center" *ngIf="!permission">
        <div class="text-muted py-5">
          <i class="ri-error-warning-line" style="font-size: 48px;"></i>
          <p class="mt-2 mb-0">Permission non trouvée</p>
        </div>
      </div>
    </div>
  </div>
</div>

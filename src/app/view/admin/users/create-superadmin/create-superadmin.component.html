<div class="modal-header">
  <h5 class="modal-title mt-0">Créer SuperAdmin</h5>
  <button type="button" class="btn-close" aria-hidden="true" (click)="bsModalRef?.hide()"></button>
</div>
<div class="modal-body">
  <loto-message-alert [messages$]="messages$"></loto-message-alert>
  
  <form (ngSubmit)="onSubmit()" [formGroup]="superAdminForm">
    <div class="row">
      <div class="col-12">
        <div class="mb-3">
          <label class="control-label">Email <span class="text-danger">*</span></label>
          <input class="form-control" placeholder="superadmin@mfix.com" type="email" 
                 formControlName="email"
                 [ngClass]="{'is-invalid': submitted && f.email.errors}" />
          <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
            <span *ngIf="f.email.errors.required">Email est requis</span>
            <span *ngIf="f.email.errors.email">Email invalide</span>
          </div>
        </div>

        <div class="mb-3">
          <label class="control-label">Mot de passe <span class="text-danger">*</span></label>
          <input class="form-control" placeholder="Mot de passe sécurisé" type="password" 
                 formControlName="password"
                 [ngClass]="{'is-invalid': submitted && f.password.errors}" />
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
            <span *ngIf="f.password.errors.required">Mot de passe requis</span>
            <span *ngIf="f.password.errors.minlength">Minimum 8 caractères</span>
          </div>
          <small class="form-text text-muted">⚠️ Assurez-vous que ALLOW_SUPERADMIN_CREATION=true est activé</small>
        </div>

        <div class="mb-3">
          <label class="control-label">Prénom <span class="text-danger">*</span></label>
          <input class="form-control" placeholder="Jean" type="text" 
                 formControlName="firstName"
                 [ngClass]="{'is-invalid': submitted && f.firstName.errors}" />
          <div *ngIf="submitted && f.firstName.errors" class="invalid-feedback">
            <span *ngIf="f.firstName.errors.required">Prénom requis</span>
          </div>
        </div>

        <div class="mb-3">
          <label class="control-label">Nom <span class="text-danger">*</span></label>
          <input class="form-control" placeholder="Dupont" type="text" 
                 formControlName="lastName"
                 [ngClass]="{'is-invalid': submitted && f.lastName.errors}" />
          <div *ngIf="submitted && f.lastName.errors" class="invalid-feedback">
            <span *ngIf="f.lastName.errors.required">Nom requis</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-danger" (click)="closeModal()">
        Annuler
      </button>
      <button type="submit" class="btn btn-success btn-load btn-center ms-2">
        <span *ngIf="!submitted || (authentificationState$|async)?.dataState !== dataStateEnum.LOADING">
          Créer SuperAdmin
        </span>
        <span *ngIf="submitted && (authentificationState$|async)?.dataState == dataStateEnum.LOADING" 
              class="d-flex align-items-center justify-content-center">
          <span class="spinner-border flex-shrink-0" role="status"></span>
        </span>
      </button>
    </div>
  </form>
</div>

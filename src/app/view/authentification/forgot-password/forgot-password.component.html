<div class="account-pages my-5 pt-sm-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card overflow-hidden">
          <div class="bg-soft bg-primary">
            <div class="row">
              <div class="col-7">
                <div class="text-primary p-4">
                  <h5 class="text-primary">Mot de passe oublié</h5>
                  <p>Entrez votre email pour recevoir un lien de réinitialisation.</p>
                </div>
              </div>
              <div class="col-5 align-self-end">
                <img src="assets/images/profile-img.png" alt="" class="img-fluid">
              </div>
            </div>
          </div>
          <div class="card-body pt-0">
            <div class="auth-logo">
              <a routerLink="/" class="auth-logo-light">
                <div class="avatar-md profile-user-wid mb-4">
                  <span class="avatar-title rounded-circle bg-light">
                    <img src="assets/images/logo.png" alt="" class="rounded-circle" height="34">
                  </span>
                </div>
              </a>
            </div>

            <div class="p-2">
              <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
                <div *ngIf="successMessage" class="alert alert-success py-2">
                  {{ successMessage }}
                </div>
                <div *ngIf="errorMessage" class="alert alert-danger py-2">
                  {{ errorMessage }}
                </div>

                <div class="mb-3">
                  <label for="email">Adresse email</label>
                  <input
                    id="email"
                    type="email"
                    class="form-control"
                    formControlName="email"
                    [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
                    placeholder="Entrez votre adresse email">
                  <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                    <div *ngIf="f.email.errors.required">L'email est requis.</div>
                    <div *ngIf="f.email.errors.email">Veuillez saisir un email valide.</div>
                  </div>
                </div>

                <div class="mt-3 d-grid">
                  <button
                    class="btn btn-primary btn-block"
                    type="submit"
                    [disabled]="isSubmitting">
                    <span *ngIf="!isSubmitting">
                      Envoyer le lien de réinitialisation
                    </span>
                    <span *ngIf="isSubmitting" class="d-flex align-items-center justify-content-center">
                      <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                      Envoi en cours...
                    </span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="mt-5 text-center">
          <p>Vous vous souvenez de votre mot de passe ?
            <a routerLink="/" class="fw-medium text-primary"> Se connecter</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
